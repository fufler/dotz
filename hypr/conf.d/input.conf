input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle,compose:rctrl,lv3:ralt_switch,misc:typo
}

input {
    touchpad {
        natural_scroll=true
        scroll_factor = 1.5
    }
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
}

gesture = 3, horizontal, workspace
